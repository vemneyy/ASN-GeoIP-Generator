name: Build asn.dat
on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 */3 * *"
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "LICENSE*"
      - "*.md"
permissions:
  contents: write
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: ./go.mod

      - name: Set variables
        run: |
          echo "TAG_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
          echo "RELEASE_NAME=$(date +%Y%m%d%H%M)" >> $GITHUB_ENV
        shell: bash

      - name: Build and run asn.dat generator
        run: |
          go mod tidy
          go build -o asn-generator ./
          ./asn-generator

      - name: Generate sha256 checksum for release files
        run: |
          cd ./output || exit 1
          sha256sum asn.dat > ./asn.dat.sha256sum
          sha256sum asn-text.zip > ./asn-text.zip.sha256sum

      - name: Rename output files to keep history
        run: |
          cd ./output || exit 1
          mv asn.dat "asn-${{ env.TAG_NAME }}.dat"
          mv asn-text.zip "asn-text-${{ env.TAG_NAME }}.zip"
          if [ -f "asn.dat.sha256sum" ]; then
            mv "asn.dat.sha256sum" "asn-${{ env.TAG_NAME }}.dat.sha256sum"
          fi
          if [ -f "asn-text.zip.sha256sum" ]; then
            mv "asn-text.zip.sha256sum" "asn-text-${{ env.TAG_NAME }}.zip.sha256sum"
          fi

      - name: Git push assets to "release" branch
        run: |
          cd output || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Добавляем удаленный репозиторий и тянем ветку release, чтобы видеть старые файлы
          git remote add geoip "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git fetch geoip release || true
          
          # Если ветка существует на удалении - переключаемся на неё, иначе создаем новую
          if git branch -r | grep 'geoip/release' >/dev/null 2>&1; then
            git checkout -b release geoip/release
          else
            git checkout -b release
          fi
          
          # ОЧИСТКА СТАРЫХ ФАЙЛОВ:
          # Ищем файлы asn-*.dat, сортируем их и удаляем всё, кроме последних 5 (head -n -5)
          ls asn-*.dat 2>/dev/null | sort | head -n -5 | xargs -r rm
          
          # То же самое для zip файлов
          ls asn-text-*.zip 2>/dev/null | sort | head -n -5 | xargs -r rm
          
          # Коммитим изменения
          git add -A
          git commit -m "${{ env.RELEASE_NAME }}"
          git push -f -u geoip release

      - name: Purge jsdelivr CDN
        run: |
          cd output || exit 1
          for file in $(ls); do
            curl -i "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done

      # Обновленные шаги загрузки релизов с учетом новых имен файлов
      - name: Upload asn.dat to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./output/asn-${{ env.TAG_NAME }}.dat
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}

      - name: Upload sha256sum to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./output/asn-${{ env.TAG_NAME }}.dat.sha256sum
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}

      - name: Upload asn-text.zip to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./output/asn-text-${{ env.TAG_NAME }}.zip
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}

      - name: Upload zip sha256sum to GitHub release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: ./output/asn-text-${{ env.TAG_NAME }}.zip.sha256sum
          release_name: ${{ env.RELEASE_NAME }}
          tag: ${{ env.TAG_NAME }}
